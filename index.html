function t(k){return I18N[state.language][k]||k}function fmt(v,n=3){return v==null?'—':Number(v).toFixed(n)}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function error(zh,en){throw Error(state.language==='zh'?zh:en)}
function msg(text,type='ok'){const el=$('msg');el.className=type;el.textContent=text}
function number(id){const e=$(id),v=e.value.trim();if(v===''||!Number.isFinite(Number(v)))error('请填写有效数值：'+(e.labels?.[0]?.textContent||id),'Enter a finite number: '+(e.labels?.[0]?.textContent||id));return Number(v)}
function parse(text){
 const source=text.replace(/^\uFEFF/,'').trim();let pairs=[];
 if(source.startsWith('{')||source.startsWith('[')){let data;try{data=JSON.parse(source)}catch(e){error('JSON 格式无效','Invalid JSON')}
  if(Array.isArray(data))pairs=data.map(p=>Array.isArray(p)?p:[p?.x,p?.y]);
  else if(Array.isArray(data.x)&&Array.isArray(data.y)&&data.x.length===data.y.length)pairs=data.x.map((v,i)=>[v,data.y[i]]);
  else error('JSON 需要等长 x/y 数组或 [角度, 强度] 数据点','JSON needs equal-length x/y arrays or [angle, intensity] points');
 }else{const numeric=/^[-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?$/;for(const [i,line] of source.split(/\r?\n/).entries()){const s=line.trim();if(!s||/^[#%!*']/.test(s))continue;const c=s.split(/[\s,;]+/);if(numeric.test(c[0])&&(c.length<2||!numeric.test(c[1])))error('第 '+(i+1)+' 行数据无效','Malformed numeric row '+(i+1));if(c.length>=2&&numeric.test(c[0])&&numeric.test(c[1]))pairs.push([Number(c[0]),Number(c[1])]);}}
 if(pairs.length<5)error('至少需要 5 个有效数据点','At least five data points are required');
 if(pairs.length>250000)error('最多支持 250,000 个点，请先降采样','Maximum 250,000 points; downsample first');
 if(pairs.some(p=>p.length<2||typeof p[0]!=='number'||typeof p[1]!=='number'||!p.slice(0,2).every(Number.isFinite)))error('角度和强度必须为有限数值','Angles and intensities must be finite numbers');
 if(pairs.some(p=>p[0]<0||p[0]>=180))error('2θ 必须位于 [0°, 180°)','2θ must be in [0°, 180°)');
 if(pairs.every(p=>p[1]===0))error('全零强度无法分析','All-zero intensities cannot be analyzed');
 const up=pairs.every((p,i)=>!i||p[0]>pairs[i-1][0]),down=pairs.every((p,i)=>!i||p[0]<pairs[i-1][0]);if(!up&&!down)error('角度必须严格单调且不能重复','Angles must be strictly monotonic and unique');if(down)pairs.reverse();
 return{x:pairs.map(p=>p[0]),y:pairs.map(p=>p[1])};
}
function validateResult(v){if(typeof v==='number'&&!Number.isFinite(v))error('计算产生非有限结果，请检查设置','Calculation produced a non-finite result; review settings');if(v&&typeof v==='object')Object.values(v).forEach(validateResult)}

function demo(){const x=[],y=[];let seed=20261021;const random=()=>{seed=(1664525*seed+1013904223)>>>0;return seed/4294967296-.5};const peaks=[[23.9,90,1],[33.34,200,.70],[40.304,1000,.65],[47.144,550,.72],[49.032,450,.72],[68.45,480,.83],[78.5,280,.91],[86.3,140,.96]];for(let i=0;i<=4000;i++){const a=10+i*.02;let v=30+.10*a+.001*(a-50)**2+random()*.8;for(const [mu,area,s] of peaks)v+=area/(s*Math.sqrt(2*Math.PI))*Math.exp(-.5*((a-mu)/s)**2);x.push(a);y.push(v)}state.x=x;state.y=y;state.name='PtCo-L10-synthetic-demo';state.synthetic=true;onLoaded()}
async function readFile(file){if(!file)return;invalidate();try{const p=parse(await file.text());state.x=p.x;state.y=p.y;state.name=file.name;state.synthetic=false;onLoaded()}catch(e){msg(e.message,'err')}finally{$('file').value=''}}
function regionData(a,b,min=8){if(!Number.isFinite(a)||!Number.isFinite(b)||b<=a)error('区间需要有限边界，且右边界 > 左边界','Window bounds must be finite with right > left');if(!state.x.length)error('请先导入谱图','Import a scan first');if(a<state.x[0]-1e-8||b>state.x.at(-1)+1e-8)error('谱图未完整覆盖所选区间','The scan does not fully cover the selected window');const xs=[],ys=[];for(let i=0;i<state.x.length;i++)if(state.x[i]>=a&&state.x[i]<=b){xs.push(state.x[i]);ys.push(state.y[i])}if(xs.length<min)error('区间内数据点不足（至少 '+min+' 个）','Too few points in the window (need '+min+')');return{xs,ys}}
function extrema(a){let min=Infinity,max=-Infinity;for(const v of a){if(v<min)min=v;if(v>max)max=v}return{min,max}}
function solveLin(A,b){A=A.map(r=>r.slice());b=b.slice();const n=b.length;for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;if(Math.abs(A[p][i])<1e-18)return null;[A[i],A[p]]=[A[p],A[i]];[b[i],b[p]]=[b[p],b[i]];for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i]}}const x=new Array(n).fill(0);for(let i=n-1;i>=0;i--){let s=b[i];for(let c=i+1;c<n;c++)s-=A[i][c]*x[c];x[i]=s/A[i][i]}return x.every(Number.isFinite)?x:null}
function snipBaseline(xs,ys){const n=ys.length,step=(xs.at(-1)-xs[0])/(n-1);for(let i=1;i<n;i++)if(Math.abs((xs[i]-xs[i-1])/step-1)>.1)error('SNIP 需要近似等间距角度，请选择线性背景拟合','SNIP requires near-uniform angles; use a linear-background fit');const wmax=Math.min(Math.floor((n-1)/2),Math.max(2,Math.round(1.2/step)));let b=ys.slice();for(let it=0;it<4;it++)for(let w=1;w<=wmax;w++){const nb=b.slice();for(let i=w;i<n-w;i++)nb[i]=Math.min(b[i],(b[i-w]+b[i+w])/2);b=nb}return b}
// Each Gaussian uses [height, center, sigma]. Jacobians use that exact order.
function gaussian(x,h,mu,s){return h*Math.exp(-.5*((x-mu)/s)**2)}

function analysisRegions(){if(state.active==='size'){const rows=[...$('peakRows').rows].map(r=>{const a=r.querySelectorAll('input');return[Number(a[1].value),Number(a[2].value),a[0].value]});return[[Number($('left').value),Number($('right').value),'selected'],...rows]}const reg=ORDER_WINDOWS.map(d=>[Number($('pt'+d.key+'L').value),Number($('pt'+d.key+'R').value),'('+d.key+')']);if($('orderMode').value==='four')reg.push([Number($('dcL').value),Number($('dcR').value),'(200)/(002)']);return reg}
function draw(){const c=$('chart'),ctx=c.getContext('2d'),W=c.width,H=c.height;ctx.clearRect(0,0,W,H);if(!state.x.length)return;const [l,r]=state.zoom||[state.x[0],state.x.at(-1)],visible=[];for(let i=0;i<state.x.length;i++)if(state.x[i]>=l&&state.x[i]<=r)visible.push(i);const values=visible.map(i=>$('sqrt').checked?Math.sqrt(Math.max(0,state.y[i])):state.y[i]),e=extrema(values),ymin=Math.min(0,e.min),ymax=e.max+(e.max-ymin)*.08,X=x=>60+(x-l)/(r-l)*(W-84),Y=y=>H-40-(y-ymin)/(ymax-ymin||1)*(H-65);grid(ctx,W,H,l,r,ymin,ymax,'2θ (°)',$('sqrt').checked?'√I':'Intensity');if($('showRegions').checked){const colors=['#2b80ce','#138779','#bd7e19','#7966bd'];ctx.save();ctx.beginPath();ctx.rect(60,25,W-84,H-65);ctx.clip();for(const [i,[a,b,label]]of analysisRegions().entries())if(Number.isFinite(a)&&Number.isFinite(b)&&b>a){ctx.fillStyle=colors[i%4]+'12';ctx.fillRect(X(a),25,X(b)-X(a),H-65);ctx.fillStyle=colors[i%4];ctx.font='11px Segoe UI';ctx.fillText(label,X(a)+4,39+i%2*14)}ctx.restore()}line(ctx,visible.map((i,j)=>[X(state.x[i]),Y(values[j])]),'#285e9b',1.3)}
function line(ctx,points,color,width=1.5,dash=[]){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();ctx.setLineDash([])}
function grid(ctx,W,H,xmin,xmax,ymin,ymax,xlabel,ylabel){ctx.font='11px Segoe UI';ctx.textAlign='right';for(let j=0;j<=4;j++){const y=H-40-j*(H-65)/4,v=ymin+(ymax-ymin)*j/4;line(ctx,[[60,y],[W-24,y]],'#e6edf5',1);ctx.fillStyle='#6b8097';ctx.fillText(Math.abs(v)>=1000?v.toExponential(1):Math.abs(v)<.1&&v!==0?v.toFixed(4):v.toFixed(1),54,y+4)}ctx.textAlign='center';for(let j=0;j<=5;j++){const x=60+j*(W-84)/5,v=xmin+(xmax-xmin)*j/5;ctx.fillText(v.toFixed(2),x,H-22)}ctx.textAlign='left';ctx.fillText(ylabel,8,16);ctx.textAlign='right';ctx.fillText(xlabel,W-24,H-4);ctx.textAlign='left'}
function drawFit(c,f){const ctx=c.getContext('2d'),W=c.width,H=c.height;ctx.clearRect(0,0,W,H);const xs=f.xs,l=xs[0],r=xs.at(-1),ys=f.direct?f.ys.map((y,i)=>y-f.base[i]):f.ys,model=f.total,vals=ys.concat(model),e=extrema(vals),ymin=Math.min(0,e.min),ymax=e.max+(e.max-ymin)*.10,X=x=>60+(x-l)/(r-l)*(W-84),Y=y=>H-40-(y-ymin)/(ymax-ymin||1)*(H-65);grid(ctx,W,H,l,r,ymin,ymax,'2θ (°)',(f.label||'')+' · '+(f.direct?'Net I':'Intensity'));line(ctx,xs.map((x,i)=>[X(x),Y(ys[i])]),'#8294a9',1.1);line(ctx,xs.map((x,i)=>[X(x),Y(model[i])]),'#1768bb',1.8);if(!f.direct){line(ctx,xs.map((x,i)=>[X(x),Y(f.base[i])]),'#b76b0b',1.2,[4,3]);if(f.components.length>1)f.components.forEach((p,k)=>line(ctx,xs.map((x,i)=>[X(x),Y(p[i]+f.base[i])]),k?'#8d65bd':'#108890',1.2,[4,3]))}}
function drawWH(wh){const c=$('whChart'),ctx=c.getContext('2d'),W=c.width,H=c.height;ctx.clearRect(0,0,W,H);const xe=extrema(wh.points.map(p=>p.x)),ye=extrema(wh.points.map(p=>p.y).concat([wh.intercept+wh.slope*xe.min,wh.intercept+wh.slope*xe.max])),yp=(ye.max-ye.min||.001)*.15,xmin=xe.min-.05,xmax=xe.max+.05,ymin=ye.min-yp,ymax=ye.max+yp,X=x=>60+(x-xmin)/(xmax-xmin)*(W-84),Y=y=>H-40-(y-ymin)/(ymax-ymin)*(H-65);grid(ctx,W,H,xmin,xmax,ymin,ymax,'4 sinθ','β cosθ (rad)');line(ctx,[[X(xe.min),Y(wh.intercept+wh.slope*xe.min)],[X(xe.max),Y(wh.intercept+wh.slope*xe.max)]],'#235fc3',1.5);ctx.fillStyle='#087f8c';for(const p of wh.points){ctx.beginPath();ctx.arc(X(p.x),Y(p.y),4,0,Math.PI*2);ctx.fill()}}
function setTab(active){state.active=active;for(const id of ['order','size','export']){$(id+'Panel').classList.toggle('hidden',id!==active);$(id+'Tab').setAttribute('aria-selected',String(id===active));$(id+'Tab').tabIndex=id===active?0:-1}draw();if(active==='export')refreshExport();if(active==='order')renderOrdering();if(active==='size')renderSize()}
function setLanguage(language){state.language=language==='en'?'en':'zh';document.documentElement.lang=state.language==='zh'?'zh-CN':'en';document.title=state.language==='zh'?'XRD-PtCoOrdering · 有序度与晶粒尺寸':'XRD-PtCoOrdering · Ordering & Crystallite Size';$('language').value=state.language;try{localStorage.setItem('xrd-ptco-language',state.language)}catch(e){}document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));document.querySelectorAll('[data-placeholder]').forEach(e=>e.placeholder=t(e.dataset.placeholder));formulaMarkup();fileInfo();renderOrdering();renderSize();refreshExport();draw();$('msg').textContent=''}
function currentAnalysis(){return{schema_version:'2.0.0',tool:'XRD-PtCoOrdering',tool_version:VERSION,exported_at:new Date().toISOString(),ordering:state.ordering,size:state.size}}
function refreshExport(){if(!$('exportJSON'))return;const valid=!!(state.ordering||state.size);$('exportJSON').disabled=!valid;$('exportCSV').disabled=!valid;$('exportSummary').className=valid?'result-body':'empty';$('exportSummary').innerHTML=valid?[state.ordering?`<p><b>${t('exportOrder')}</b> · ${escapeHTML(state.ordering.sample_name)} · ${t(state.ordering.metric.mode==='two'?'modeTwo':'modeFour')} · <b>${fmt(state.ordering.metric.ordering_percent,2)}%</b></p>`:'',state.size?`<p><b>${t('exportSize')}</b> · ${escapeHTML(state.size.sample_name)} · ${state.size.peaks.map(p=>`${escapeHTML(p.label==='selected_peak'?t('selectedPeak'):p.label)}: <b>${fmt(p.D_nm,2)} nm</b>`).join(' · ')}</p>`:''].join(''):t('noResults')}
function csvCell(v){let s=v==null?'':String(v);if(typeof v==='string'&&/^[\s\uFEFF]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function analysisCSV(a){const header=['analysis','sample_name','synthetic','tool_version','formula_mode','formula','ordering_percent','normalized_ratio_R','long_range_order_percent','reference_source','reference_verified','reflection','2theta_deg','area_intensity_deg','fwhm_deg','integral_breadth_deg','measured_width_deg','corrected_width_deg','beta_rad','Scherrer_D_nm','empirical_D_nm','K','wavelength_A','width_definition','instrument_width_deg','instrument_profile','background_method','region_left_deg','region_right_deg','fit_RMS','fit_R2','fit_review','reference_integrated_intensity','WH_D_nm','WH_strain','WH_R2','WH_status','calibration_factor','calibration_source'];const rows=[header];if(a.ordering){const o=a.ordering,m=o.metric;for(const p of o.peaks)rows.push(['ordering',o.sample_name,o.synthetic,a.tool_version,m.mode,m.formula,m.ordering_percent,m.R,m.long_range_order_percent,o.reference_source,m.reference_verified,p.reflection,p.peak,p.area,p.fwhm,p.integralBreadth,null,null,null,null,null,null,null,null,null,null,p.method,null,null,p.rms,p.r2,p.review??false,o.reference_intensities[p.reflection],null,null,null,null,null,null])}if(a.size){const s=a.size,settings=s.settings,wh=s.williamson_hall;for(const p of s.peaks)rows.push(['size',s.sample_name,s.synthetic,a.tool_version,null,null,null,null,null,null,null,p.label,p.peak,p.area,p.fwhm,p.integralBreadth,p.width_deg,p.corrected_width_deg,p.beta_rad,p.D_nm,p.empirical_size_nm,settings.K,settings.lambda_A,settings.width_mode,settings.instrument_width_deg,settings.instrument_profile,p.method,p.region_deg[0],p.region_deg[1],p.rms,p.r2,p.review??false,null,wh?.D_nm,wh?.strain,wh?.r2,wh?.status,settings.calibration_factor,settings.calibration_source])}return '\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n')+'\r\n'}
function downloadFile(name,text,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('drop').onclick=()=>$('file').click();$('file').onchange=e=>readFile(e.target.files[0]);for(const ev of ['dragover','dragenter'])$('drop').addEventListener(ev,e=>{e.preventDefault()});$('drop').addEventListener('drop',e=>{e.preventDefault();readFile(e.dataTransfer.files[0])});$('demo').onclick=demo;$('language').onchange=e=>setLanguage(e.target.value);$('orderMode').onchange=updateMode;$('areaSource').onchange=updateMode;$('ptCalc').onclick=computeOrdering;$('calc').onclick=()=>computeSize(false);$('multiCalc').onclick=()=>computeSize(true);$('add').onclick=()=>{addRow('',37,44.2);invalidate('size');draw()};$('size111').onclick=()=>{$('left').value=37;$('right').value=44.2;invalidate('size');draw()};$('size220').onclick=()=>{$('left').value=65.3;$('right').value=71.6;invalidate('size');draw()};$('reset').onclick=()=>{state.zoom=null;draw()};$('sqrt').onchange=draw;$('showRegions').onchange=draw;for(const id of ['order','size','export'])$(id+'Tab').onclick=()=>setTab(id);document.querySelector('.tabs').onkeydown=e=>{if(!['ArrowRight','ArrowLeft','Home','End'].includes(e.key))return;e.preventDefault();const ids=['order','size','export'],i=ids.indexOf(state.active),next=e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3;setTab(ids[next]);$(ids[next]+'Tab').focus()};
